<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <section>
      <div class="container">
        <div class="resultField">
          <div class="resultImages">
            <span class="userResult">
              <h4>User</h4>
              <img src="./assets/rock.png" alt="" srcset="" />
            </span>
            <span class="cpuResult">
              <h4>Computer</h4>
              <img src="./assets/rock.png" alt="" srcset="" />
            </span>
          </div>
          <div class="result">Let's Play!!</div>
        </div>
        <div class="optionImages">
          <span class="optionimage">
            <img src="./assets/rock.png" alt="" />
            <p>rock</p>
          </span>
          <span class="optionimage">
            <img src="./assets/paper.png" alt="" />
            <p>paper</p>
          </span>
          <span class="optionimage">
            <img src="./assets/scissors.png" alt="" />
            <p>scissors</p>
          </span>
        </div>
      </div>
    </section>
  </body>
</html>
