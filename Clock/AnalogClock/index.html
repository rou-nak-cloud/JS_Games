<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analog Clock</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="clock">
        <label class="pos-1"><span>1</span></label>
        <label class="pos-2"><span>2</span></label>
        <label class="pos-3"><span>3</span></label>
        <label class="pos-4"><span>4</span></label>
        <label class="pos-5"><span>5</span></label>
        <label class="pos-6"><span>6</span></label>
        <label class="pos-7"><span>7</span></label>
        <label class="pos-8"><span>8</span></label>
        <label class="pos-9"><span>9</span></label>
        <label class="pos-10"><span>10</span></label>
        <label class="pos-11"><span>11</span></label>
        <label class="pos-12"><span>12</span></label>

        <div class="indicator">
          <span class="hand hour"></span>
          <span class="hand minute"></span>
          <span class="hand second"></span>
        </div>
      </div>

      <div class="modeSwitch">Dark Mode</div>
    </div>
  </body>
</html>
