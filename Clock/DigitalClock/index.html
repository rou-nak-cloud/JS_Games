<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <script
      src="https://kit.fontawesome.com/cc69542d82.js"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <section>
      <div class="container">
        <div class="icons">
          <i class="fa-solid fa-moon"></i>
          <i class="fa-solid fa-sun"></i>
        </div>
        <div class="time">
          <div class="timeColon">
            <div class="timeText">
              <span class="num hourNum">08</span>
              <span class="text">Hours</span>
            </div>
            <span class="colon">:</span>
          </div>
          <div class="timeColon">
            <div class="timeText">
              <span class="num minNum">45</span>
              <span class="text">Minutes</span>
            </div>
            <span class="colon">:</span>
          </div>
          <div class="timeColon">
            <div class="timeText">
              <span class="num secNum">30</span>
              <span class="text">Seconds</span>
            </div>
            <span class="am_pm">AM</span>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
